name: cascade

# Beacon is a Zone-1 sibling. Cascades from upstream releases arrive
# as repository_dispatch events; we delegate the whole bump-build-
# tag-push dance to pilot-protocol/release's reusable tag-bump
# workflow. Two-trigger setup so we can also manually exercise the
# cascade from the Actions tab.

on:
  repository_dispatch:
    types: [bump-upstream]
  workflow_dispatch:
    inputs:
      upstream:
        description: 'Upstream Go module (e.g. github.com/pilot-protocol/common)'
        required: true
        type: string
      version:
        description: 'Upstream version (e.g. v0.4.0 or v0.5.0-beta.1)'
        required: true
        type: string
      is_prerelease:
        description: 'true if upstream is a beta/rc'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write   # tag-bump lands bumps via PR + auto-merge

jobs:
  bump:
    uses: pilot-protocol/release/.github/workflows/tag-bump.yml@main
    with:
      upstream: ${{ inputs.upstream || github.event.client_payload.upstream }}
      version: ${{ inputs.version || github.event.client_payload.version }}
      is_prerelease: ${{ inputs.is_prerelease == true || github.event.client_payload.is_prerelease == true }}
      stable_only: true
    secrets:
      CHANGELOG_SECRET: ${{ secrets.CHANGELOG_SECRET }}
