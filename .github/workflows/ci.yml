name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6
        with:
          path: beacon

      - name: Checkout web4
        uses: actions/checkout@v6
        with:
          repository: TeoSlayer/pilotprotocol
          path: web4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: beacon/go.sum

      - name: Run tests with coverage
        working-directory: beacon
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./beacon/coverage.out
          flags: unittests
          name: beacon
          fail_ci_if_error: false

      - name: Coverage summary
        working-directory: beacon
        run: go tool cover -func=coverage.out | tail -20

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-beacon
          path: beacon/coverage.out
          retention-days: 30
